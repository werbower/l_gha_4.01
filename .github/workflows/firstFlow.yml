
name: CI #this is a name
on: #controls when the wf will run
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: #allow to run manually

jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 #checkout
      - name: Run a script
        run: echo Hello, world!
      - name: Run a multiline script
        run: |
          echo Add other action,
          echo test, deploy
  process: #additional job
    runs-on: ubuntu-latest
    steps:
      - name: run a one-line script
        run: echo Hello, world!

      - name: run multiline script
        run: |
          echo add others
          echo test and deploy
